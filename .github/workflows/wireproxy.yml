name: Test and build patched WireProxy

on:
  workflow_dispatch:
  push:
    paths:
      - "wireproxy/source/**"
      - "wireproxy/build.sh"
      - ".github/workflows/wireproxy.yml"
  pull_request:
    paths:
      - "wireproxy/source/**"
      - "wireproxy/build.sh"
      - ".github/workflows/wireproxy.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: wireproxy/source/go.sum

      - name: Test connection lifecycle
        working-directory: wireproxy/source
        run: go test -race ./...

      - name: Cross-compile bundled archives
        run: VERSION=1.1.3-selfheal.1 ./wireproxy/build.sh

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: wireproxy-1.1.3-selfheal.1-linux
          path: |
            wireproxy/wireproxy_linux_*.tar.gz
            wireproxy/SHA256SUMS
